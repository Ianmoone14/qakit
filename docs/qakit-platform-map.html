<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QAKit — platform map</title>
  <style>
    :root {
      --void: #12151a;
      --ink: #e8e4db;
      --mute: #9a9488;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--void); color: var(--ink); font-family: "Segoe UI", sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 36px 32px 64px; }
    h1 {
      font-family: Georgia, serif;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.03em;
      margin: 0 0 6px;
    }
    .kicker { color: #3dbaa8; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; margin: 0 0 8px; }
    svg { width: 100%; height: auto; display: block; margin: 22px 0 8px; }
  </style>
</head>
<body>
<main>
  <p class="kicker">One page · Phase 1–2 · testers write uiTest · engine is runQakitTest</p>
  <h1>Core runs the phases. Adapters put a device on the registry. Teams write uiTest.</h1>

  <!-- 1. Layers -->
  <svg viewBox="0 0 1100 420" role="img" aria-label="Three layers">
    <style>
      .t { font: 600 15px Segoe UI, sans-serif; fill: #e8e4db; }
      .s { font: 13px Segoe UI, sans-serif; fill: #9a9488; }
      .h { font: 12px Segoe UI, sans-serif; fill: #3dbaa8; letter-spacing: 0.08em; }
    </style>
    <text class="h" x="20" y="18">LAYER 1 · CORE CREATES THIS (everyone gets it)</text>
    <rect x="20" y="28" width="1060" height="118" fill="#16332f" stroke="#3dbaa8"/>
    <rect x="40" y="48" width="150" height="78" fill="#1a1f26" stroke="#3dbaa8"/><text class="t" x="56" y="80">config</text><text class="s" x="56" y="100">ctx.config</text>
    <rect x="204" y="48" width="150" height="78" fill="#1a1f26" stroke="#3dbaa8"/><text class="t" x="220" y="80">runQakitTest</text><text class="s" x="220" y="100">6 phases</text>
    <rect x="368" y="48" width="150" height="78" fill="#1a1f26" stroke="#3dbaa8"/><text class="t" x="384" y="80">registry</text><text class="s" x="384" y="100">ctx.services</text>
    <rect x="532" y="48" width="150" height="78" fill="#1a1f26" stroke="#3dbaa8"/><text class="t" x="548" y="80">logger</text><text class="s" x="548" y="100">ctx.logger</text>
    <rect x="696" y="48" width="150" height="78" fill="#1a1f26" stroke="#3dbaa8"/><text class="t" x="712" y="80">artifacts</text><text class="s" x="712" y="100">ctx.artifacts</text>
    <rect x="860" y="48" width="200" height="78" fill="#1a1f26" stroke="#3dbaa8"/><text class="t" x="876" y="80">results</text><text class="s" x="876" y="100">ExecutionSummary</text>

    <text class="h" x="20" y="176" fill="#7aa6d4">LAYER 2 · ADAPTERS ADD A DEVICE (they do not rebuild layer 1)</text>
    <rect x="20" y="186" width="250" height="100" fill="#1a1f26" stroke="#3dbaa8"/>
    <text class="t" x="36" y="218">playwright</text>
    <text class="s" x="36" y="240">uiTest → { page }</text>
    <text class="s" x="36" y="260">qakit.playwright.json</text>
    <rect x="290" y="186" width="250" height="100" fill="#1a1f26" stroke="#7aa6d4"/>
    <text class="t" x="306" y="218">api</text>
    <text class="s" x="306" y="240">apiTest → { api }</text>
    <text class="s" x="306" y="260">baseUrl in qakit.config</text>
    <rect x="560" y="186" width="250" height="100" fill="#1a1f26" stroke="#e08a7a"/>
    <text class="t" x="576" y="218">appium later</text>
    <text class="s" x="576" y="240">mobileTest → { driver }</text>
    <text class="s" x="576" y="260">qakit.appium.json</text>
    <rect x="830" y="186" width="250" height="100" fill="#1a1f26" stroke="#e0b15a"/>
    <text class="t" x="846" y="218">reporter later</text>
    <text class="s" x="846" y="240">reads summary only</text>
    <text class="s" x="846" y="260">no browser</text>

    <text class="h" x="20" y="318" fill="#e0b15a">LAYER 3 · TEAM WRITES THE PRODUCT</text>
    <rect x="20" y="328" width="1060" height="78" fill="#2a2418" stroke="#e0b15a"/>
    <text class="t" x="40" y="360">uiTest / apiTest bodies · locators · pages/ · tokens · CI</text>
    <text class="s" x="40" y="384">not in core · init is smoke tests only, not POM</text>
  </svg>

  <!-- 2. Who takes what -->
  <svg viewBox="0 0 1100 430" role="img" aria-label="Who uses each core piece">
    <style>
      .t { font: 600 13px Segoe UI, sans-serif; fill: #e8e4db; }
      .s { font: 12px Segoe UI, sans-serif; fill: #9a9488; }
      .h { font: 12px Segoe UI, sans-serif; fill: #3dbaa8; letter-spacing: 0.08em; }
      .ok { font: 700 16px Segoe UI, sans-serif; fill: #3dbaa8; }
      .no { font: 700 16px Segoe UI, sans-serif; fill: #3a424c; }
    </style>
    <text class="h" x="20" y="18">WHO TAKES WHAT FROM CORE</text>
    <text class="s" x="300" y="18">teal = uses it · grey = does not need it</text>

    <!-- header -->
    <text class="s" x="20" y="52">core piece</text>
    <text class="s" x="300" y="52">playwright</text>
    <text class="s" x="460" y="52">api</text>
    <text class="s" x="590" y="52">appium</text>
    <text class="s" x="740" y="52">reporter</text>
    <text class="s" x="900" y="52">team test</text>

    <line x1="20" y1="62" x2="1080" y2="62" stroke="#2a3038"/>

    <!-- rows -->
    <g font-family="Segoe UI, sans-serif">
      <text class="t" x="20" y="92">config</text>
      <text class="ok" x="330" y="92">●</text><text class="ok" x="478" y="92">●</text><text class="ok" x="618" y="92">●</text><text class="no" x="768" y="92">○</text><text class="ok" x="938" y="92">●</text>

      <text class="t" x="20" y="128">lifecycle hooks</text>
      <text class="ok" x="330" y="128">●</text><text class="ok" x="478" y="128">●</text><text class="ok" x="618" y="128">●</text><text class="no" x="768" y="128">○</text><text class="no" x="938" y="128">○</text>

      <text class="t" x="20" y="164">registry</text>
      <text class="ok" x="330" y="164">● put page</text>
      <text class="ok" x="460" y="164">● put client</text>
      <text class="ok" x="590" y="164">● put driver</text>
      <text class="no" x="768" y="164">○</text>
      <text class="ok" x="900" y="164">● { page, api }</text>

      <text class="t" x="20" y="200">logger</text>
      <text class="ok" x="330" y="200">●</text><text class="ok" x="478" y="200">●</text><text class="ok" x="618" y="200">●</text><text class="no" x="768" y="200">○</text><text class="ok" x="938" y="200">●</text>

      <text class="t" x="20" y="236">artifacts.save</text>
      <text class="ok" x="330" y="236">● png / zip</text>
      <text class="ok" x="460" y="236">● req / res</text>
      <text class="ok" x="590" y="236">● png</text>
      <text class="ok" x="740" y="236">● read files</text>
      <text class="no" x="938" y="236">○</text>

      <text class="t" x="20" y="272">errors</text>
      <text class="ok" x="330" y="272">●</text><text class="ok" x="478" y="272">●</text><text class="ok" x="618" y="272">●</text><text class="no" x="768" y="272">○</text><text class="ok" x="938" y="272">●</text>

      <text class="t" x="20" y="308">ExecutionSummary</text>
      <text class="ok" x="300" y="308">● via runUiTest</text>
      <text class="ok" x="460" y="308">● via runApiTest</text>
      <text class="ok" x="590" y="308">● later</text>
      <text class="ok" x="740" y="308">● ingest</text>
      <text class="ok" x="900" y="308">● print after</text>

      <text class="t" x="20" y="344">AuthProvider</text>
      <text class="no" x="330" y="344">○</text>
      <text class="ok" x="460" y="344">● headers</text>
      <text class="no" x="618" y="344">○</text>
      <text class="no" x="768" y="344">○</text>
      <text class="ok" x="900" y="344">● implements</text>

      <text class="t" x="20" y="380">pages / locators / POM</text>
      <text class="no" x="330" y="380">○</text><text class="no" x="478" y="380">○</text><text class="no" x="618" y="380">○</text><text class="no" x="768" y="380">○</text>
      <text class="ok" x="900" y="380">● only here</text>
    </g>
    <line x1="20" y1="400" x2="1080" y2="400" stroke="#2a3038"/>
    <text class="s" x="20" y="422">Adapters never re-create config, cleanup, or results. They hang on ctx.</text>
  </svg>

  <!-- 3. Three names, one engine -->
  <svg viewBox="0 0 1100 360" role="img" aria-label="Three names one engine">
    <style>
      .t { font: 600 14px Segoe UI, sans-serif; fill: #e8e4db; }
      .s { font: 12px Segoe UI, sans-serif; fill: #9a9488; }
      .h { font: 12px Segoe UI, sans-serif; fill: #3dbaa8; letter-spacing: 0.08em; }
    </style>
    <text class="h" x="20" y="18">THREE NAMES · SAME RUN · DIFFERENT JOBS</text>

    <rect x="20" y="36" width="1060" height="72" fill="#2a2418" stroke="#e0b15a"/>
    <text class="t" x="40" y="64">1. uiTest / apiTest</text>
    <text class="s" x="280" y="64">what testers write · wraps Vitest it() · terminal is green or red</text>
    <text class="s" x="280" y="86">does not return a summary — Vitest only sees pass / fail</text>

    <rect x="20" y="120" width="1060" height="72" fill="#1a1f26" stroke="#7aa6d4"/>
    <text class="t" x="40" y="148">2. runUiTest / runApiTest</text>
    <text class="s" x="280" y="148">same run, no Vitest · returns ExecutionSummary</text>
    <text class="s" x="280" y="170">print or assert after the callback — not inside async ({ page }) =&gt; …</text>

    <rect x="20" y="204" width="1060" height="72" fill="#16332f" stroke="#3dbaa8"/>
    <text class="t" x="40" y="232">3. runQakitTest</text>
    <text class="s" x="280" y="232">@qakit/core · six phases · no Page · no fetch types</text>
    <text class="s" x="280" y="254">adapters register the device · core only runs the schedule</text>

    <rect x="20" y="288" width="1060" height="56" fill="#1a1f26" stroke="#2a3038"/>
    <text class="s" x="40" y="312">Long form (registerPlaywright + ServiceKeys) still works if you are not on Vitest. New tests do not copy it.</text>
    <text class="s" x="40" y="332">Appium later = mobileTest({ driver }) in a new package. Same runQakitTest. Not a new core. Not driver on { page }.</text>
  </svg>

  <!-- 4. One run flow -->
  <svg viewBox="0 0 1100 240" role="img" aria-label="One run flow">
    <style>
      .t { font: 600 14px Segoe UI, sans-serif; fill: #e8e4db; }
      .s { font: 12px Segoe UI, sans-serif; fill: #9a9488; }
      .h { font: 12px Segoe UI, sans-serif; fill: #3dbaa8; letter-spacing: 0.08em; }
    </style>
    <text class="h" x="20" y="18">ONE RUN · YOU CALL THE TOP · CORE RUNS THE BOTTOM</text>
    <rect x="20" y="36" width="240" height="88" fill="#2a2418" stroke="#e0b15a"/><text class="t" x="36" y="70">uiTest / apiTest</text><text class="s" x="36" y="92">Vitest green / red</text>
    <path d="M260 80 L298 80" stroke="#e0b15a" stroke-width="2"/><polygon points="298,74 312,80 298,86" fill="#e0b15a"/>
    <rect x="318" y="36" width="250" height="88" fill="#1a1f26" stroke="#7aa6d4"/><text class="t" x="334" y="70">runUiTest / runApiTest</text><text class="s" x="334" y="92">returns summary after</text>
    <path d="M568 80 L606 80" stroke="#3dbaa8" stroke-width="2"/><polygon points="606,74 620,80 606,86" fill="#3dbaa8"/>
    <rect x="626" y="36" width="240" height="88" fill="#16332f" stroke="#3dbaa8"/><text class="t" x="642" y="70">runQakitTest</text><text class="s" x="642" y="92">six phases · no browser</text>
    <path d="M866 80 L904 80" stroke="#e0b15a" stroke-width="2"/><polygon points="904,74 918,80 904,86" fill="#e0b15a"/>
    <rect x="924" y="36" width="156" height="88" fill="#2a2418" stroke="#e0b15a"/><text class="t" x="940" y="70">team body</text><text class="s" x="940" y="92">page.goto / request</text>

    <rect x="20" y="148" width="1060" height="72" fill="#1a1f26" stroke="#2a3038"/>
    <text class="s" x="40" y="178">same ctx · cleanup LIFO · artifacts/&lt;executionId&gt; · print ExecutionSummary from runUiTest · Reporter not called yet</text>
    <text class="s" x="40" y="200">qakit init --playwright --api · docs/team-start.md · playwright json is adapter-owned · no Appium flag until the package exists</text>
  </svg>

  <!-- 5. POM visual -->
  <svg viewBox="0 0 1100 280" role="img" aria-label="Page objects stay in team repos">
    <style>
      .t { font: 600 14px Segoe UI, sans-serif; fill: #e8e4db; }
      .s { font: 12px Segoe UI, sans-serif; fill: #9a9488; }
      .h { font: 12px Segoe UI, sans-serif; fill: #e08a7a; letter-spacing: 0.08em; }
      .g { font: 12px Segoe UI, sans-serif; fill: #3dbaa8; letter-spacing: 0.08em; }
    </style>
    <text class="h" x="20" y="18">WRONG · POM IN CORE</text>
    <rect x="20" y="32" width="500" height="100" fill="#2a1818" stroke="#e08a7a"/>
    <text class="t" x="36" y="64">@qakit/core + LoginPage</text>
    <text class="s" x="36" y="86">checkout · SAP · banking all inherit one login</text>
    <text class="s" x="36" y="108">matches nobody</text>

    <text class="g" x="560" y="18">RIGHT · POM IN THE TEAM</text>
    <rect x="560" y="32" width="150" height="100" fill="#2a2418" stroke="#e0b15a"/><text class="t" x="572" y="72">team A</text><text class="s" x="572" y="92">pages/</text>
    <rect x="724" y="32" width="150" height="100" fill="#2a2418" stroke="#e0b15a"/><text class="t" x="736" y="72">team B</text><text class="s" x="736" y="92">pages/</text>
    <rect x="888" y="32" width="192" height="100" fill="#2a2418" stroke="#e0b15a"/><text class="t" x="900" y="72">team C</text><text class="s" x="900" y="92">pages/</text>

    <path d="M635 132 L635 168" stroke="#3dbaa8"/><path d="M799 132 L799 168" stroke="#3dbaa8"/><path d="M984 132 L984 168" stroke="#3dbaa8"/>
    <path d="M635 168 L984 168" stroke="#3dbaa8"/>
    <rect x="680" y="176" width="280" height="88" fill="#16332f" stroke="#3dbaa8"/>
    <text class="t" x="696" y="208">only if A, B, C share a pattern</text>
    <text class="s" x="696" y="230">then extract a small package</text>
    <text class="s" x="696" y="248">core still has no pages</text>
  </svg>
</main>
</body>
</html>
